name: Publish to npm

on:
  release:
    types: [published]

# For Trusted Publishing via OIDC (recommended long-term): configure the npm
# publisher on npmjs.com and remove the NODE_AUTH_TOKEN env below. Until that is
# in place, `--provenance` still ties the release to this workflow run.
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --ci

      - name: Build
        run: npm run build

      - name: Dist smoke (require + dynamic import)
        run: npm run smoke

      - name: Publish
        # --access public is a no-op for unscoped packages (public by default) but
        # kept explicit so nothing changes if we later switch back to a scoped name.
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
