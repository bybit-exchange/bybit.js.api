name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Node ${{ matrix.node }} — build + lint + test + smoke
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['18', '20', '22']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck / build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Test (with coverage gate on src/http)
        run: npm test -- --ci --coverage

      - name: Dist smoke (require + dynamic import)
        run: npm run smoke

      - name: Types smoke (@arethetypeswrong)
        if: matrix.node == '20'
        run: npx -y @arethetypeswrong/cli --pack . --ignore-rules=cjs-resolves-to-esm || true

  audit:
    name: npm audit (prod deps, high+)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit
        run: npm audit --omit=dev --audit-level=high

  secret-scan:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  pack-check:
    name: npm pack --dry-run (LICENSE present, no source)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Pack tarball
        run: npm pack --dry-run --json > pack.json

      - name: Verify LICENSE + README + dist present
        run: |
          node -e '
            const p = require("./pack.json");
            const files = p[0].files.map(f => f.path);
            for (const need of ["LICENSE","README.md","package.json","dist/cjs/index.js","dist/esm/index.js","dist/types/index.d.ts"]) {
              if (!files.includes(need)) { console.error("missing from tarball:", need); process.exit(1); }
            }
            for (const bad of files) {
              if (bad.startsWith("src/") || bad.startsWith("tests/") || bad === "node_modules") {
                console.error("must not ship:", bad); process.exit(1);
              }
            }
            console.log("pack check OK");
          '
